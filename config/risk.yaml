# Risk configuration. Tune these to your account and tolerance.
# Position sizing:  shares = floor( (account_size * risk_pct/100) / abs(entry - stop) )
# then capped so the position value never exceeds max_position_pct of the account.

account:
  size_usd: 47000           # live NetLiquidation ~€47,047 (base currency EUR).
                            # Used as a conservative USD sizing base: since 1 EUR > 1 USD,
                            # the USD buying power is actually a bit higher, so positions are
                            # slightly undersized (safe). Refine with the live EURUSD rate if desired.
  data_mode: delayed        # delayed | realtime  (paper + delayed is free)

# Shared guardrails (apply across the whole account):
limits:
  max_concurrent_positions: 5
  max_position_pct: 20.0    # any single position capped at this % of account
  daily_loss_limit_pct: 3.0 # if down this % on the day, stop proposing NEW entries (exits still run)
  # HARD per-position loss floor, ALWAYS honored — even with no_exit_at_loss.
  # This caps tail risk and is the stop used for position sizing, so risk-per-
  # trade is real rather than fictional. Set the % to your max tolerable loss.
  catastrophic_stop_pct: 8.0
  pdt_min_equity_usd: 25000 # below this, US margin accounts face the PDT day-trade limit

# Per-style risk (all relative to account.size_usd — no hardcoded $ amounts):
day_trading:
  # Day-trade sizing (user-set 2026-06-15). Position auto-trims to honor BOTH:
  #   shares = min( risk%/100 * account / |entry-stop|,  max_position_pct/100 * account / entry )
  # Tight stop -> hits the capital cap (~max_position_pct); wide stop -> trims to hold the risk cap.
  risk_per_trade_pct: 1.5      # max loss per day trade, % of account (~$600 @ $47k)
  max_position_pct: 50         # max capital per day trade, % of account (~$20k @ $47k);
                               # overrides the global 20% cap FOR DAY TRADES ONLY
  max_concurrent_positions: 3

swing_trading:
  risk_per_trade_pct: 1.0      # uses the global max_position_pct (20%) cap
  max_hold_days: 10
