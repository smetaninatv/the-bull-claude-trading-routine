# Signal/strategy parameters for candidate search. Tune freely.

swing:
  trend_sma: 200          # macro trend filter (price should be on the right side of it)
  entry_ema: 8            # short-term momentum / entry timing
  resistance:
    lookback_bars: 60     # how far back to look for the resistance level
    min_touches: 2        # level must be tested at least this many times
    tolerance_pct: 1.0    # swing highs within this % count as the same level
    breakout_confirm_pct: 0.0  # extra % above the level to confirm a breakout
    wing: 2               # swing-high pivot = max of [-wing, +wing] window
    max_dist_pct: 12.0    # only consider resistance within this % of price; return
                          # the NEAREST qualifying level (not the most-touched one),
                          # so trending names don't get a stale far-below level

day:
  timeframe: "5 mins"     # day-trade chart timeframe
  use_vwap: true          # trade relative to session VWAP
  min_bar_volume: 70000   # DEPRECATED raw share floor — kept for reference only
  min_dollar_volume: 5000000        # 3-bar avg dollar volume floor ($/bar) at open
  min_dollar_volume_midday: 8000000 # > 60 min after open: thinner tape, higher bar
  ema8_max_below_pct: 2.0    # flag if price > this % below EMA8; skip if > 5%
  min_rr_open: 2.0           # minimum reward:risk in the first 60 min
  min_rr_midday: 3.0         # minimum reward:risk after 60 min (need wider edge)
  trend_day_score: 8         # day_trade_conditions score >= this = trend day:
                             #   NO fixed target (trail only) + enable post-stop re-entry
  noise_band_atr_mult: 1.5   # min stop distance = this × 5-min ATR (avoid shakeouts)

orders:
  # Management of UNFILLED resting entry orders (market-open step 1c, exit-scan 4c).
  stale_entry_sessions: 3            # cancel-recommend an entry resting unfilled this many sessions
  cancel_unfilled_before_weekend: true  # Fri last scan: flag every unfilled entry for keep/cancel
                                        # (avoid a Monday gap filling a stale limit into weakness)

exits:
  trailing_lookback: 2    # 2-bar trailing stop: exit if price drops below the
                          # lowest low of the last N candles (ratchets up only)
  drop_forming: false     # true = trail off completed candles only
  include_current: false  # 2-bar-low window: false = bars before the new-high bar
  # Timeframe the trailing stop is measured on, per style:
  swing_timeframe: "1 day"
  day_timeframe: "5 mins"
  # Day-trade stop: 2-bar ratchet is PRIMARY; VWAP-trail is a FLOOR beneath it.
  # (AMD 2026-06-12: VWAP-trail alone exited at the bottom of a flush that reversed.)
  day_vwap_buffer_atr: 1.5     # VWAP floor = VWAP − this × ATR (was 0.5, too tight)
  day_post_stop_reentry: true  # on a trend day, scan for VWAP-reclaim re-entry after a stop
  # HOLD underwater positions — never realize a loss; only exit at breakeven+.
  # WARNING: this removes downside protection. A held position can keep falling;
  # the trailing stop then only protects GAINS, not losses. Set false to restore
  # normal stop-loss behavior.
  no_exit_at_loss: true
